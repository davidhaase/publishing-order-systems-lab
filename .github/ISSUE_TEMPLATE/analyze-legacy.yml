name: Analyze Legacy System
description: Document the functionality, business rules, behavioral cases, dependencies, and data flow of a legacy program or domain.
title: "[Legacy Analysis]: "
labels:
  - "legacy-analysis"

body:
  - type: textarea
    id: analysis_target
    attributes:
      label: What would you like to understand?
      description: Describe the program, process, business function, or domain you want analyzed.
      placeholder: "Example: How does order cancellation work?"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: What kind of scope are you starting with?
      options:
        - A specific program or component
        - A business process or domain
        - I’m not sure yet
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why are you investigating this?
      description: Optional context about the problem, change, or modernization effort may help the analysis.
      placeholder: "Example: We are considering replacing this process and need to understand current behavior."
